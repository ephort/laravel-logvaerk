name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '8.*',  testbench: '6.*',  phpunit: '9.*' }
          - { php: '8.2', laravel: '9.*',  testbench: '7.*',  phpunit: '9.*' }
          - { php: '8.2', laravel: '10.*', testbench: '8.*',  phpunit: '10.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*',  phpunit: '11.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', phpunit: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', phpunit: '12.*' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false || composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress -W

      - name: Run tests
        run: vendor/bin/phpunit
